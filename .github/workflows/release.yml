name: Release Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build:
    name: 'Build APK'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v7

      - name: 'Setup JDK'
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: 'Cache Gradle Dependencies'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 'Clean Build Directory'
        run: |
          rm -rf app/build

      - name: 'Grant Gradle Permission'
        run: |
          chmod +x ./gradlew

      - name: 'Setup Keystore'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: 'Verify Keystore'
        run: |
          if [ -s "keystore.jks" ]; then
            echo "Keystore file exists and is non-empty."
          else
            echo "Keystore file is missing or empty!" && exit 1
          fi

      - name: 'Increment Version Code'
        run: |
          VERSION_CODE=$(cat app/version.txt)
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          echo $NEW_VERSION_CODE > app/version.txt

      - name: 'Extract Version Information'
        id: version
        run: |
          VERSION_NAME=$(./gradlew :app:printVersionName -q)
          VERSION_CODE=$(cat app/version.txt)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION_NAME-b$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: 'Setup Config'
        run: |
          echo "${{ secrets.CONFIG }}" > app/config.properties

      - name: 'Build APK'
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew clean assembleRelease

      - name: 'Upload APK'
        uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: 'error'

      - name: 'Commit and Push Version Increment'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add app/version.txt
          git commit -m "Bump versionCode to ${{ steps.version.outputs.version_code }}"
          git push

      - name: 'Create and Push Tag'
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: 'Create Draft Release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "${{ steps.version.outputs.tag }}" \
            --draft \
            --notes "Draft release for version ${{ steps.version.outputs.version_name }} (Build ${{ steps.version.outputs.version_code }})" \
            app/build/outputs/apk/release/app-release.apk
